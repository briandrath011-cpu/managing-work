# Minimal Roblox standard library for selene (offline). Declares Roblox globals so
# selene can still catch undefined variables, shadowing and unused code.
---
base: luau
name: roblox_lite
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  Instance: { any: true }
  Vector3: { any: true }
  Vector2: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  NumberRange: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Enum: { any: true }
  Random: { any: true }
  RaycastParams: { any: true }
  OverlapParams: { any: true }
  TweenInfo: { any: true }
  BrickColor: { any: true }
  Rect: { any: true }
  Ray: { any: true }
  Font: { any: true }
  PhysicalProperties: { any: true }
  Region3: { any: true }
  DateTime: { any: true }
  PathWaypoint: { any: true }
  SharedTable: { any: true }
  task: { any: true }
  typeof: { any: true }
  tick: { any: true }
  time: { any: true }
  warn: { any: true }
  delay: { any: true }
  spawn: { any: true }
  wait: { any: true }
  debug: { any: true }
  utf8: { any: true }
  bit32: { any: true }
  buffer: { any: true }
  Faces: { any: true }
  Axes: { any: true }
  elapsedTime: { any: true }
  settings: { any: true }
  UserSettings: { any: true }
